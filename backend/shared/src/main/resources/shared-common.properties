spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:${db.path:../../db}/books-quest.db
spring.datasource.username=admin
spring.datasource.password=adventure123
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.servlet.context-path=

spring.jackson.serialization.indent-output=false

app.cors.allowed-origins=http://localhost:4200,http://localhost:3000

logging.level.com.booksquest=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework=WARN

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# JWT Configuration
jwt.secret=your-secret-key-change-this-in-production-must-be-at-least-32-chars-long-and-secure
jwt.expiration-ms=3600000

# HTTP Request/Response Logging Configuration
app.http-logging.enabled=true
app.http-logging.log-headers=true
app.http-logging.log-bodies=true
app.http-logging.log-query-params=true
app.http-logging.max-body-length=5000
app.http-logging.excluded-paths=/actuator/*,/health,/metrics,/swagger-ui,/v3/api-docs,/webjars
