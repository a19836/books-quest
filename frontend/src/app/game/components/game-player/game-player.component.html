<div class="row justify-content-center">
  <div class="col-12 col-xl-10">
    <div class="card shadow-sm border-0 mb-3">
      <div class="card-body d-flex flex-wrap gap-2 align-items-center justify-content-between">
        <div class="d-flex gap-2 flex-wrap">
          <button
            (click)="goToPreviousSection()"
            class="btn btn-warning"
            [disabled]="sectionHistory.length === 0 || isMoving">
            ← Previous Step
          </button>
          <button
            (click)="saveCurrentGame()"
            class="btn btn-warning"
            [disabled]="sectionHistory.length === 0 || isSaving">
            {{ isSaving ? 'Saving...' : '💾 Save Game' }}
          </button>
        </div>
        <h1 class="h4 fw-bold mb-0 text-center flex-grow-1" *ngIf="book">📖 {{ book.title }}</h1>
        <button (click)="goBack()" class="btn btn-secondary">Exit Game →</button>
      </div>
    </div>

    <div *ngIf="saveMessage" class="alert" [ngClass]="saveMessage.includes('✓') ? 'alert-success' : 'alert-danger'">
      {{ saveMessage }}
    </div>

    <div *ngIf="isLoading" class="text-center py-5">
      <div class="spinner-border text-warning" role="status"></div>
      <p class="mt-3 mb-0 text-secondary">Loading game...</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
      {{ errorMessage }}
    </div>

    <div *ngIf="!isLoading && currentSection && gameSession" class="card shadow-sm border-0">
      <div class="card-body p-4 p-md-5 d-flex flex-column gap-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
          <span class="badge rounded-pill bg-warning text-dark px-3 py-2">
            {{ getSectionType(currentSection.type) }}
          </span>
          <span class="badge rounded-pill fs-6 px-3 py-2" [ngClass]="gameSession.activeHealth <= 3 ? 'text-bg-danger' : 'text-bg-success'">
            ❤️ {{ gameSession.activeHealth }}/10
          </span>
        </div>

        <div class="border-start border-4 border-warning ps-3">
          <h2 class="h4 mb-0 lh-base">{{ currentSection.text }}</h2>
        </div>

        <div *ngIf="currentSection.type !== 'END'" class="d-flex flex-column gap-3">
          <p class="fw-semibold mb-0">What do you choose?</p>
          <button
            *ngFor="let option of currentSection.options; let i = index"
            (click)="selectOption(option.gotoId)"
            class="btn btn-light border text-start option-button"
            [disabled]="isMoving">
            <div class="d-flex align-items-center justify-content-between gap-3">
              <div class="d-flex align-items-center gap-3">
                <span class="option-number">{{ i + 1 }}</span>
                <span class="flex-grow-1">{{ option.description }}</span>
              </div>
              <span *ngIf="option.consequence" class="badge text-bg-secondary">
                {{ option.consequence.type === 'LOSE_HEALTH' ? '❤️ -' : '✨ +' }}{{ option.consequence.value }}
              </span>
            </div>
            <small *ngIf="option.consequence && option.consequence.text" class="text-secondary text-start d-block mt-2 ms-5">
              {{ option.consequence.text }}
            </small>
          </button>
        </div>

        <div class="text-center p-4 border border-2 border-warning rounded-4 bg-light" *ngIf="currentSection.type === 'END'">
          <p class="display-6 fw-bold text-warning mb-3">The End</p>
          <button (click)="goBack()" class="btn btn-warning btn-lg fw-semibold">Continue to Book List</button>
        </div>

        <div class="text-end text-secondary small">
          <span>Status: <strong>{{ gameSession.status }}</strong></span>
        </div>
      </div>
    </div>
  </div>
</div>
